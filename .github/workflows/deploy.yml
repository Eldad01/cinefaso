name: Deploy CinéFaso

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Se connecter à Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Construire l'image Docker
      - name: Build Docker image
        run: |
          docker build \
            -t eldad01/cinefaso:latest \
            -t eldad01/cinefaso:${{ github.sha }} \
            .

      # 4. Envoyer l'image vers Docker Hub
      - name: Push Docker image
        run: |
          docker push eldad01/cinefaso:latest
          docker push eldad01/cinefaso:${{ github.sha }}

      # 5. Installer la clé SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github-actions-cinefaso
          chmod 600 ~/.ssh/github-actions-cinefaso
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # 6. Synchroniser le script de déploiement (au cas où il aurait changé)
      - name: Sync deploy script
        run: |
          scp -i ~/.ssh/github-actions-cinefaso -o StrictHostKeyChecking=no \
            deploy-pull.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/cinefaso/deploy-pull.sh
          ssh -i ~/.ssh/github-actions-cinefaso ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod +x /opt/cinefaso/deploy-pull.sh"

      # 7. Déployer sur le VPS
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/github-actions-cinefaso ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "/opt/cinefaso/deploy-pull.sh"
